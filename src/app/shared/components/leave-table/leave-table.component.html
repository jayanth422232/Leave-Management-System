<table mat-table [dataSource]="requests" class="full-width">
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Leave Type</th>
    <td mat-cell *matCellDef="let r">{{ typeName(r.leaveTypeId) }}</td>
  </ng-container>

  <ng-container matColumnDef="from">
    <th mat-header-cell *matHeaderCellDef>From</th>
    <td mat-cell *matCellDef="let r">{{ r.fromDate | date: 'dd-MMM-yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="to">
    <th mat-header-cell *matHeaderCellDef>To</th>
    <td mat-cell *matCellDef="let r">{{ r.toDate | date: 'dd-MMM-yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="days">
    <th mat-header-cell *matHeaderCellDef>Days</th>
    <td mat-cell *matCellDef="let r">{{ r.days }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let r"><app-status-badge [status]="r.status" /></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (requests.length === 0) {
  <p class="empty">No leave requests found.</p>
}
