<h2>Leave Types</h2>

<form [formGroup]="form" (ngSubmit)="addType()" class="add-form">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Max Days/Year</mat-label>
    <input matInput type="number" formControlName="maxDays" />
  </mat-form-field>

  <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Add</button>
</form>

@if (loading()) {
  <p>Loading...</p>
} @else {
  <table mat-table [dataSource]="types()" class="full-width">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let t">{{ t.name }}</td>
    </ng-container>

    <ng-container matColumnDef="maxDays">
      <th mat-header-cell *matHeaderCellDef>Max Days</th>
      <td mat-cell *matCellDef="let t">{{ t.maxDays }}</td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Active</th>
      <td mat-cell *matCellDef="let t">
        <mat-slide-toggle [checked]="t.active" (change)="toggleActive(t)" />
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let t">
        <button mat-button color="warn" (click)="deleteType(t)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
}
